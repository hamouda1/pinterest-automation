<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};       /* e.g., #F4EFEA */
      --accent-color: {{ACCENT_COLOR}}; /* e.g., #B85D3B */
      --text-dark: #18181B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      background-image: radial-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px);
      background-size: 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 55px 60px;
      position: relative;
      overflow: hidden;
    }

    .top-accent-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 420px;
      background-color: var(--accent-color);
      border-bottom-left-radius: 80px;
      border-bottom-right-radius: 80px;
      z-index: 1;
    }

    .header-badge {
      position: relative;
      z-index: 4;
      background: var(--text-dark);
      color: #ffffff;
      padding: 14px 40px;
      border-radius: 100px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
      margin-bottom: -26px;
      border: 4px solid #ffffff;
    }

    .product-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 820px;
      background-color: #ffffff;
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 75px 65px 110px 65px;
      border: 8px solid rgba(255, 255, 255, 0.9);
    }

    .product-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .floating-rating {
      position: absolute;
      top: 48px;
      right: -18px;
      background: #FFFBEB;
      color: #B45309;
      border: 3px solid #FCD34D;
      padding: 12px 26px;
      border-radius: 18px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      transform: rotate(4deg);
      z-index: 5;
    }

    .content-card {
      position: relative;
      z-index: 3;
      width: 92%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 36px;
      padding: 45px 45px 40px;
      margin-top: -85px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.13);
      border: 2px solid #ffffff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-card::before {
      content: "";
      width: 85px;
      height: 7px;
      background-color: var(--accent-color);
      border-radius: 10px;
      margin-bottom: 24px;
    }

    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: 46px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
      margin-bottom: 35px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cta-wrapper {
      width: 100%;
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 24px 40px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.16);
    }

    .cta-arrow {
      background: rgba(255, 255, 255, 0.25);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .footer-domain {
      margin-top: auto;
      padding-top: 25px;
      font-size: 20px;
      font-weight: 700;
      color: #64646A;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>

  <div class="top-accent-bg"></div>

  <div class="header-badge">{{CATEGORY}}</div>

  <div class="product-stage">
    <div class="floating-rating">★ Top Rated Find</div>
    <img src="{{IMAGE_URL}}" alt="Amazon Find">
  </div>

  <div class="content-card">
    <h1 class="product-title">{{TITLE}}</h1>
    <div class="cta-wrapper">
      <span>Shop The Find</span>
      <span class="cta-arrow">→</span>
    </div>
  </div>

  <div class="footer-domain">{{DOMAIN_NAME}}</div>

</body>
</html>
