<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};       /* e.g., #EAE3DC */
      --accent-color: {{ACCENT_COLOR}}; /* e.g., #7F4F24 */
      --text-dark: #1C1917;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 70px 45px;
      position: relative;
      overflow: hidden;
    }

    /* إطار خطي خارجي رفيع يعطي طابع المجلات المطبوعة */
    .editorial-border {
      position: absolute;
      inset: 28px;
      border: 2px solid rgba(28, 25, 23, 0.18);
      pointer-events: none;
      z-index: 10;
    }

    .top-kicker {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--accent-color);
      margin-bottom: 14px;
    }

    .editorial-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 62px;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      line-height: 1.08;
      margin-bottom: 40px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* القوس الأبيض الحاضن لصورة أمازون */
    .arch-stage {
      width: 100%;
      height: 920px;
      background-color: #ffffff;
      border-radius: 430px 430px 36px 36px; /* سر شكل القوس */
      padding: 110px 75px 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 30px 65px rgba(0, 0, 0, 0.09);
      border: 6px solid #ffffff;
      outline: 2px solid var(--accent-color);
      outline-offset: 12px;
    }

    .arch-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* ختم دائري جانبي */
    .aesthetic-seal {
      position: absolute;
      bottom: 45px;
      right: -25px;
      width: 140px;
      height: 140px;
      background-color: var(--text-dark);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.3;
      border: 5px solid var(--bg-primary);
      transform: rotate(8deg);
      box-shadow: 0 15px 30px rgba(0,0,0,0.18);
    }

    .bottom-cta-row {
      margin-top: auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--accent-color);
      color: #ffffff;
      padding: 24px 42px;
      border-radius: 100px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.14);
    }

    .cta-text {
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .domain-tag {
      font-size: 20px;
      font-weight: 600;
      opacity: 0.9;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="editorial-border"></div>

  <div class="top-kicker">{{CATEGORY}}</div>
  <h1 class="editorial-title">{{TITLE}}</h1>

  <div class="arch-stage">
    <img src="{{IMAGE_URL}}" alt="Curated Find">
    <div class="aesthetic-seal">
      <span>Editor's</span>
      <span>Pick ★</span>
    </div>
  </div>

  <div class="bottom-cta-row">
    <span class="cta-text">Tap To View Details →</span>
    <span class="domain-tag">{{DOMAIN_NAME}}</span>
  </div>

</body>
</html>
