<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};       /* e.g., #F3EFEA */
      --accent-color: {{ACCENT_COLOR}}; /* e.g., #2C4A3E */
      --text-dark: #18181B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      background-image: radial-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px);
      background-size: 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 45px 55px;
      position: relative;
      overflow: hidden;
    }

    .top-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 320px;
      background-color: var(--accent-color);
      border-bottom-left-radius: 70px;
      border-bottom-right-radius: 70px;
      z-index: 1;
    }

    .category-pill {
      position: relative;
      z-index: 4;
      background: var(--text-dark);
      color: #ffffff;
      padding: 13px 38px;
      border-radius: 100px;
      font-size: 21px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      margin-bottom: 25px;
    }

    .collage-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 860px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-item {
      background-color: #ffffff;
      border-radius: 34px;
      padding: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      border: 4px solid #ffffff;
      overflow: hidden;
    }

    .grid-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* الترقيم على اليسار ليتوافق مع القراءة الإنجليزية LTR */
    .item-number {
      position: absolute;
      top: 18px;
      left: 18px;
      background-color: var(--bg-primary);
      color: var(--accent-color);
      width: 50px;
      height: 50px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .center-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-5deg);
      width: 150px;
      height: 150px;
      background-color: var(--accent-color);
      color: #ffffff;
      border-radius: 50%;
      border: 8px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.25;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.22);
      z-index: 5;
    }

    .bottom-card {
      position: relative;
      z-index: 3;
      width: 94%;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-radius: 36px;
      padding: 38px 45px 35px;
      margin-top: -55px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.13);
      border: 3px solid #ffffff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .collage-title {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
      margin-bottom: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cta-bar {
      width: 100%;
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 22px 35px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.16);
    }

    .cta-icon {
      background: rgba(255, 255, 255, 0.25);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .footer {
      margin-top: auto;
      padding-top: 18px;
      font-size: 19px;
      font-weight: 700;
      color: #64646A;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>

  <div class="top-banner"></div>

  <div class="category-pill">{{CATEGORY}}</div>

  <div class="collage-wrapper">
    <div class="grid-item">
      <span class="item-number">01</span>
      <img src="{{IMAGE_1}}" alt="Product 1">
    </div>

    <div class="grid-item">
      <span class="item-number">02</span>
      <img src="{{IMAGE_2}}" alt="Product 2">
    </div>

    <div class="grid-item">
      <span class="item-number">03</span>
      <img src="{{IMAGE_3}}" alt="Product 3">
    </div>

    <div class="grid-item">
      <span class="item-number">04</span>
      <img src="{{IMAGE_4}}" alt="Product 4">
    </div>

    <div class="center-badge">
      <span>Must</span>
      <span>Haves ★</span>
    </div>
  </div>

  <div class="bottom-card">
    <h1 class="collage-title">{{COLLECTION_TITLE}}</h1>
    <div class="cta-bar">
      <span>Explore Full List</span>
      <span class="cta-icon">→</span>
    </div>
  </div>

  <div class="footer">{{DOMAIN_NAME}}</div>

</body>
</html>
