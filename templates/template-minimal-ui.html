<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};       /* e.g., #F6F4F0 */
      --accent-color: {{ACCENT_COLOR}}; /* e.g., #9A3412 */
      --text-dark: #18181B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      padding: 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* الحاوية الرئيسية البيضاء بالكامل لتذويب خلفية أمازون */
    .ui-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 48px;
      padding: 50px 55px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 30px 70px rgba(0,0,0,0.08);
      position: relative;
    }

    /* شريط علوي يشبه واجهة التطبيقات */
    .ui-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #F1F1F4;
      padding-bottom: 28px;
    }

    .category-tag {
      background: var(--bg-primary);
      color: var(--text-dark);
      padding: 12px 28px;
      border-radius: 100px;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .save-pill {
      background: #FEE2E2;
      color: #DC2626;
      padding: 12px 26px;
      border-radius: 100px;
      font-size: 20px;
      font-weight: 800;
    }

    /* منطقة صورة المنتج */
    .image-zone {
      height: 700px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .image-zone img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* قسم التفاصيل السفلي الملون */
    .details-panel {
      background: var(--bg-primary);
      border-radius: 36px;
      padding: 42px;
      text-align: left;
    }

    .stars-row {
      color: #F59E0B;
      font-size: 26px;
      letter-spacing: 4px;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .stars-row span {
      color: #52525B;
      font-size: 20px;
      letter-spacing: 0.5px;
      margin-left: 10px;
    }

    .item-title {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
      margin-bottom: 30px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-color);
      color: #ffffff;
      padding: 24px 36px;
      border-radius: 22px;
    }

    .btn-label {
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .site-label {
      font-size: 19px;
      font-weight: 700;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="ui-card">
    <div class="ui-top-bar">
      <span class="category-tag">{{CATEGORY}}</span>
      <span class="save-pill">♥ Save For Later</span>
    </div>

    <div class="image-zone">
      <img src="{{IMAGE_URL}}" alt="Product">
    </div>

    <div class="details-panel">
      <div class="stars-row">★★★★★ <span>Highly Rated Find</span></div>
      <h1 class="item-title">{{TITLE}}</h1>
      <div class="action-row">
        <span class="btn-label">Check It Out →</span>
        <span class="site-label">{{DOMAIN_NAME}}</span>
      </div>
    </div>
  </div>

</body>
</html>
