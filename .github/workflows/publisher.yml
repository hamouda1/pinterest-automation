name: Pinterest 24/7 Multi-Account Network Publisher

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pillow python-dotenv

      - name: Run Multi-Account Publisher Dispatch
        env:
          PINTEREST_ACCOUNTS_JSON: ${{ secrets.PINTEREST_ACCOUNTS_JSON }}
          PINTEREST_ROOT: .
          USE_BRIDGE: "true"
          BRIDGE_BASE_URL: "https://hamouda1.github.io/pinterest-automation/"
        run: |
          python master_network_publisher.py

      - name: Commit & Push Updated Queues
        run: |
          git config --global user.name "Pinterest Cloud Publisher"
          git config --global user.email "bot@pinterest-network.internal"
          git add campaign_queue_*.json seller_central_store/campaign_queue_*.json last_network_publish_report.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-publish cycle: 11 accounts updated [skip ci]" && git push)
