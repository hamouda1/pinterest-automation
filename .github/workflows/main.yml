name: Pinterest Pins Cloud Generator

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pins:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Playwright Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Pin Generator Script
        run: python generate_pins.py

      - name: Upload Generated Pins as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-pins
          path: output/*.jpg
          retention-days: 7

      - name: Commit and Push Generated Pins to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.jpg
          git diff --staged --quiet || (git commit -m "Auto-generated Pinterest pins [skip ci]" && git push)
